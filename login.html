<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samudra AI | Secure Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
        .auth-container h2 { color: #0056b3; margin-bottom: 5px; }
        .auth-container p { color: #718096; margin-bottom: 25px; font-size: 14px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: #475569; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        .btn-primary { background: #0056b3; color: white; }
        .btn-primary:hover { background: #004494; }
        .btn-google { background: #ffffff; color: #1e293b; border: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-google:hover { background: #f8fafc; }
        .toggle-text { font-size: 13px; color: #475569; cursor: pointer; margin-top: 15px; }
        .toggle-text span { color: #0056b3; font-weight: 600; }
        #errorMessage { color: #f44336; font-size: 13px; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2>🌊 Samudra AI</h2>
        <p id="authSubtitle">Sign in to access the marine dashboard</p>
        
        <div id="errorMessage"></div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="agent@samudra.ai">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button class="btn btn-primary" id="mainAuthBtn" onclick="handleEmailAuth()">Sign In</button>
        
        <div style="margin: 15px 0; color: #cbd5e1; font-size: 12px;">OR</div>
        
        <button class="btn btn-google" onclick="signInWithGoogle()">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="18" alt="Google">
            Continue with Google
        </button>

        <div class="toggle-text" onclick="toggleMode()">
            <span id="toggleLink">Need an account? Sign Up</span>
        </div>
    </div>

    <script>
        // Samudra AI Project Keys
        const firebaseConfig = {
            apiKey: "AIzaSyDK-wkmz5HRWkOXI1b7ncz0wVYs7gv18qY",
            authDomain: "samudra-ai-agent.firebaseapp.com",
            projectId: "samudra-ai-agent",
            storageBucket: "samudra-ai-agent.firebasestorage.app",
            messagingSenderId: "210402465389",
            appId: "1:210402465389:web:03262776b7a6eceb391164",
            measurementId: "G-X23M482E1P"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let isLoginMode = true;

        // Redirect to index.html if logged in
        auth.onAuthStateChanged(user => {
            if (user) window.location.href = "index.html"; 
        });

        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById("mainAuthBtn").innerText = isLoginMode ? "Sign In" : "Create Account";
            document.getElementById("authSubtitle").innerText = isLoginMode ? "Sign in to access the marine dashboard" : "Register a new operator account";
            document.getElementById("toggleLink").innerText = isLoginMode ? "Need an account? Sign Up" : "Already have an account? Sign In";
            document.getElementById("errorMessage").style.display = "none";
        }

        async function handleEmailAuth() {
            const email = document.getElementById("email").value;
            const pass = document.getElementById("password").value;
            const errorDiv = document.getElementById("errorMessage");
            
            try {
                if (isLoginMode) {
                    await auth.signInWithEmailAndPassword(email, pass);
                } else {
                    await auth.createUserWithEmailAndPassword(email, pass);
                }
            } catch (error) {
                errorDiv.style.display = "block";
                errorDiv.innerText = error.message;
            }
        }

        async function signInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                await auth.signInWithPopup(provider);
            } catch (error) {
                document.getElementById("errorMessage").style.display = "block";
                document.getElementById("errorMessage").innerText = error.message;
            }
        }

        // Redirect to index.html if logged in
        auth.onAuthStateChanged(user => {
            if (user) {
                window.location.href = "index.html"; 
            }
        });

    </script>
</body>
</html>
